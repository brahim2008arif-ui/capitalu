                      className="flex-1 bg-red-600 text-white font-bold text-xs py-3 rounded-xl shadow cursor-pointer"
                    >
                      {isRtl ? 'المتابعة لعجلة الحظ' : 'Claim Lucky Wheel Spin'}
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowWelcomePromo(false)}
                      className="bg-gray-200 text-gray-700 text-xs px-3 rounded-xl font-bold"
                    >
                      {isRtl ? 'إغلاق' : 'Close'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Lucky Wheel Modal */}
            {showLuckyWheel && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-white rounded-3xl p-5 text-center shadow-2xl">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="font-bold text-gray-900 text-sm">{isRtl ? 'عجلة الحظ اليومية' : 'Lucky Draw'}</h3>
                    <button type="button" onClick={() => setShowLuckyWheel(false)} className="text-gray-400">
                      <Icons.X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="bg-red-50 rounded-2xl p-3 mb-4 text-xs font-bold text-red-600">
                    {userState.luckyDrawRemaining > 0
                      ? (isRtl ? 'فرصة مجانية متاحة الآن!' : '1 Free spin available!')
                      : (isRtl ? `تتجدد بعد: ${formatTime(luckyCountdownMs)}` : `Refills in: ${formatTime(luckyCountdownMs)}`)}
                  </div>

                  <div className="relative mx-auto w-48 h-48 my-4 rounded-full border-4 border-red-500 flex items-center justify-center bg-rose-50 shadow-inner">
                    <div className="text-center">
                      <Icons.Trophy className="w-10 h-10 text-amber-500 mx-auto mb-1 animate-bounce" />
                      <span className="text-xs font-black text-gray-800">USDT Rewards</span>
                    </div>
                  </div>

                  <button
                    type="button"
                    disabled={userState.luckyDrawRemaining <= 0}
                    onClick={() => {
                      const prize = Math.random() > 0.5 ? 0.50 : (Math.random() > 0.5 ? 0.10 : 1.50);
                      handleSpinWheel(prize);
                    }}
                    className={`w-full py-3 rounded-xl font-bold text-xs shadow ${
                      userState.luckyDrawRemaining > 0
                        ? 'bg-red-600 hover:bg-red-700 text-white cursor-pointer'
                        : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                    }`}
                  >
                    {userState.luckyDrawRemaining > 0 ? (isRtl ? 'تدوير العجلة الآن' : 'Spin Wheel') : (isRtl ? 'انتظر التجديد' : 'Cooldown')}
                  </button>
                </div>
              </div>
            )}

            {/* Financial Records Modal */}
            {showRecords && (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl max-h-[80vh] flex flex-col">
                  <div className="flex justify-between items-center pb-3 border-b border-gray-100">
                    <h3 className="font-bold text-sm text-gray-900">{t.financialRecords}</h3>
                    <button type="button" onClick={() => setShowRecords(false)}><Icons.X className="w-5 h-5" /></button>
                  </div>
                  <div className="overflow-y-auto flex-1 py-3 space-y-2">
                    {userState.records.length === 0 ? (
                      <p className="text-center text-xs text-gray-400 py-6">{isRtl ? 'لا توجد سجلات' : 'No records'}</p>
                    ) : (
                      userState.records.map(r => (
                        <div key={r.id} className="bg-gray-50 rounded-xl p-2.5 text-xs flex justify-between items-center">
                          <div>
                            <p className="font-bold text-gray-800">{r.type}</p>
                            <p className="text-[10px] text-gray-400 font-mono">{r.date}</p>
                          </div>
                          <div className="text-end">
                            <p className="font-black text-xs text-emerald-600">{r.amount > 0 ? '+' : ''}{r.amount.toFixed(2)} USDT</p>
                            <span className="text-[9px] font-bold text-amber-600">{r.status}</span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Daily Check-In 30-Day Rewards Modal */}
            {showDailyCheckIn && (
              <div
                onClick={(e) => {
                  if (e.target === e.currentTarget) setShowDailyCheckIn(false);
                }}
                className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto cursor-pointer"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl border border-amber-200/60 flex flex-col max-h-[92vh] cursor-default"
                >
                  {/* Header */}
                  <div className="bg-gradient-to-r from-gray-950 via-red-950 to-amber-950 text-white p-4 sm:p-5 relative border-b border-amber-500/20">
                    {/* Prominent Exit Button (X) */}
                    <button
                      id="close-standalone-checkin-btn"
                      type="button"
                      onClick={() => setShowDailyCheckIn(false)}
                      className={`absolute top-3.5 ${
                        isRtl ? 'left-3.5' : 'right-3.5'
                      } w-9 h-9 rounded-full bg-white/20 hover:bg-red-600 active:scale-90 border border-white/30 text-white flex items-center justify-center transition-all shadow-md cursor-pointer z-20 group`}
                      title={isRtl ? 'إغلاق (✕)' : 'Close (✕)'}
                      aria-label="Close"
                    >
                      <Icons.X className="w-5 h-5 text-white group-hover:rotate-90 transition-transform duration-200" />
                    </button>
                    <span className="bg-gradient-to-r from-amber-500 to-red-500 text-gray-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider inline-block mb-1">
                      {isRtl ? 'برنامج المكافآت المتراكمة' : 'Loyalty Check-In'}
                    </span>
                    <h2 className="text-lg font-black text-white flex items-center gap-2">
                      <Icons.Task className="w-5 h-5 text-amber-400" />
                      <span>{isRtl ? 'جدول تسجيل الدخول اليومي' : 'Daily Check-In Schedule'}</span>
                    </h2>
                    <p className="text-xs text-amber-200/90 mt-0.5">
                      {isRtl
                        ? 'تبدأ المكافآت من اليوم 3 وتتضاعف حتى 500 USDT في اليوم 30!'
                        : 'Rewards start from Day 3 & scale up to 500 USDT on Day 30!'}
                    </p>

                    <div className="mt-3 grid grid-cols-3 gap-2 bg-white/10 rounded-2xl p-2.5 text-center text-xs">
                      <div>
                        <span className="text-[10px] text-gray-300 block">{isRtl ? 'السلسلة' : 'Streak'}</span>
                        <span className="font-black text-amber-300">{userState.checkInStreak || 0} {isRtl ? 'أيام' : 'Days'}</span>
                      </div>
                      <div className="border-x border-white/10">
                        <span className="text-[10px] text-gray-300 block">{isRtl ? 'اليوم التالي' : 'Next'}</span>
                        <span className="font-black text-white">{isRtl ? `اليوم ${(userState.checkInStreak || 0) + 1}` : `Day ${(userState.checkInStreak || 0) + 1}`}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-gray-300 block">{isRtl ? 'الجائزة الكبرى' : 'Top Prize'}</span>
                        <span className="font-black text-emerald-400">500 USDT</span>
                      </div>
                    </div>
                  </div>

                  {/* 24-Hour Cooldown Timer Notice */}
                  {isCheckInCooldown ? (
                    <div className="bg-gradient-to-r from-amber-950 via-gray-900 to-red-950 border-b border-amber-500/30 p-3 text-white flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Icons.Clock className="w-4 h-4 text-amber-400 animate-pulse" />
                        <span className="text-xs font-bold text-amber-300">
                          {isRtl ? `اليوم التالي يفتح بعد: ` : `Next day unlocks in: `}
                        </span>
                      </div>
                      <span className="bg-black/60 px-2.5 py-1 rounded-lg border border-amber-400/40 font-mono font-black text-amber-400 text-xs">
                        {formatTime(checkInRemainingMs)}
                      </span>
                    </div>
                  ) : (
                    <div className="bg-amber-50 border-b border-amber-200/80 px-4 py-2 text-[11px] text-amber-900 font-medium">
                      {isRtl
                        ? 'ملاحظة: اليوم 1 و 2 لتثبيت السلسلة، وتبدأ المكافآت المالية من اليوم 3 (1.77 USDT).'
                        : 'Note: Days 1 & 2 establish streak. Cash rewards unlock starting Day 3 (1.77 USDT).'}
                    </div>
                  )}

                  {/* 30-Day Grid */}
                  <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    <div className="grid grid-cols-5 gap-2">
                      {DAILY_CHECK_IN_REWARDS.map(item => {
                        const isClaimed = (userState.claimedCheckInDays || []).includes(item.day);
                        const isCurrentEligible = !isCheckInCooldown && (userState.checkInStreak || 0) + 1 === item.day;
                        const isNextLocked = isCheckInCooldown && (userState.checkInStreak || 0) + 1 === item.day;

                        return (
                          <div
                            key={item.day}
                            className={`relative rounded-2xl p-2 flex flex-col items-center justify-between text-center transition-all ${
                              isClaimed
                                ? 'bg-emerald-50 border border-emerald-300 text-emerald-800'
                                : isCurrentEligible
                                ? 'bg-gradient-to-b from-amber-50 to-red-50 border-2 border-red-500 shadow-md ring-2 ring-red-400/30 scale-105 z-10'
                                : isNextLocked
                                ? 'bg-amber-50/70 border border-amber-400 text-amber-900 shadow-xs'
                                : item.day === 30
                                ? 'bg-amber-100/70 border border-amber-400 text-amber-950 font-bold'
                                : 'bg-gray-50 border border-gray-200 text-gray-600'
                            }`}
                          >
                            <span className="text-[10px] font-bold block mb-0.5">
                              {isRtl ? `يوم ${item.day}` : `D${item.day}`}
                            </span>
                            <div className="my-1">
                              {isClaimed ? (
                                <Icons.Check className="w-5 h-5 text-emerald-600" />
                              ) : isCurrentEligible ? (
                                <Icons.Gift className="w-5 h-5 text-red-600 animate-bounce" />
                              ) : isNextLocked ? (
                                <Icons.Clock className="w-4 h-4 text-amber-600 animate-pulse" />
                              ) : (
                                <Icons.Clock className="w-4 h-4 text-gray-400" />
                              )}
                            </div>
                            <div className="mt-0.5 leading-tight">
                              {item.reward > 0 ? (
                                <span className={`text-[11px] font-black block ${isClaimed ? 'text-emerald-700' : isCurrentEligible ? 'text-red-700 font-extrabold' : isNextLocked ? 'text-amber-800 font-bold' : 'text-gray-700'}`}>
                                  +{item.reward}
                                </span>
                              ) : (
                                <span className="text-[10px] text-gray-400 font-semibold block">{isRtl ? 'حضور' : 'Check'}</span>
                              )}
                              <span className="text-[8px] text-gray-400 font-mono block">USDT</span>
                            </div>
                            {item.day === 30 && (
                              <span className="absolute -top-1.5 bg-gradient-to-r from-amber-500 to-red-600 text-white text-[7px] font-black px-1 rounded-full">
                                500$
                              </span>
                            )}
                            {isNextLocked && (
                              <span className="absolute -top-1.5 bg-amber-600 text-white text-[7px] font-black px-1 rounded-full">
                                24h
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Footer Button */}
                  <div className="p-4 bg-gray-50 border-t border-gray-200 flex flex-col gap-2">
                    {!isCheckInCooldown ? (
                      <button
                        type="button"
                        onClick={handleClaimCheckIn}
                        className="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-red-600 via-rose-600 to-amber-500 text-white font-extrabold text-sm shadow-lg shadow-red-500/30 active:scale-98 transition flex items-center justify-center gap-2 cursor-pointer"
                      >
                        <Icons.Task className="w-4 h-4" />
                        <span>
                          {isRtl
                            ? `تسجيل دخول اليوم واستلام المكافأة (اليوم ${(userState.checkInStreak || 0) + 1})`
                            : `Check-in Today (Day ${(userState.checkInStreak || 0) + 1})`}
                        </span>
                      </button>
                    ) : (
                      <div className="space-y-2">
                        <button
                          type="button"
                          disabled
                          className="w-full py-3.5 px-4 rounded-2xl bg-gray-200 border border-gray-300 text-gray-500 font-extrabold text-sm flex items-center justify-center gap-2 cursor-not-allowed select-none"
                        >
                          <Icons.Clock className="w-4 h-4 text-amber-600" />
                          <span>
                            {isRtl
                              ? `يرجى الانتظار (${formatTime(checkInRemainingMs)}) لليوم ${(userState.checkInStreak || 0) + 1}`
                              : `Please wait (${formatTime(checkInRemainingMs)}) for Day ${(userState.checkInStreak || 0) + 1}`}
                          </span>
                        </button>
                        <div className="text-center text-[11px] text-gray-500 font-medium">
                          {isRtl
                            ? `تم استلام مكافأة اليوم ${userState.checkInStreak} بنجاح! يتم تفعيل اليوم التالي بعد 24 ساعة.`
                            : `Day ${userState.checkInStreak} claimed successfully! Next day unlocks after 24 hours.`}
                        </div>
                      </div>
                    )}

                    {/* Close/Exit Button */}
                    <button
                      id="close-standalone-checkin-footer-btn"
                      type="button"
                      onClick={() => setShowDailyCheckIn(false)}
                      className="w-full py-2.5 px-4 rounded-xl border border-gray-300 hover:border-gray-400 bg-white hover:bg-gray-100 text-gray-700 font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-98 cursor-pointer shadow-xs"
                    >
                      <Icons.X className="w-3.5 h-3.5 text-gray-500" />
                      <span>{isRtl ? 'إغلاق ومغادرة الجدول' : 'Close Schedule'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Notification Toast */}
            {toast.visible && (
              <div className="fixed top-16 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs z-50 font-bold max-w-xs text-center border border-gray-700">
                {toast.text}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the React application into #root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
